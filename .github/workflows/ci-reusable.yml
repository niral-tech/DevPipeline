name: CI (reusable)

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        required: false
        default: "24"
    secrets:
      TOKEN:
        required: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-project
        with:
          node-version: ${{ inputs.node-version }}
      - run: npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-project
        with:
          node-version: ${{ inputs.node-version }}
      - run: echo "Build step (nothing to compile yet) — pipeline is green."