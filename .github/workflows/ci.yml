name: CI

on: [push, pull_request]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1; 
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0; 
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint


  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1; 
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0; 
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1; 
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0; 
        with:
          node-version: 24
      - run: npm ci
      - run: echo "Build step (nothing to compile yet) — pipeline is green."

  coverage:
    runs-on: ubuntu-latest
    outputs:
      pct: ${{ steps.pct.outputs.pct }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1; 
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0; 
        with:
          node-version: 24
      - run: npm ci
      - name: Run tests with coverage
        run: npm run test
      - name: Compute line-coverage percentage
        id: pct
        run: |
          PCT=$(node -p "require('./coverage/coverage-summary.json').total.lines.pct")
          echo "Line coverage: $PCT%"
          echo "pct=$PCT" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 #v7.0.2;
        with:
          name: coverage-report
          path: coverage/
          retention-days: 5
  
  report:
    needs: coverage
    runs-on: ubuntu-latest
    steps:
      - name: Show coverage from upstream job
        run: |
          echo "Coverage reported by the coverage job: ${{ needs.coverage.outputs.pct }}%"
          echo "### Coverage: ${{ needs.coverage.outputs.pct }}%" >> "$GITHUB_STEP_SUMMARY"

  gate:
    needs: report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1; 
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0; 
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test

  context:
    runs-on: ubuntu-latest
    env: 
      APP: ${{ vars.APP_NAME }}
      TOKEN: ${{ secrets.DEPLOY_TOKEN }}
    steps:
      - name: Report run context
        run: |
          echo "App : $APP"
          echo "Actor : ${{ github.actor }}"
          echo "Ref : ${{ github.ref }}"
          echo "Commit: ${GITHUB_SHA:0:7}"
          echo "Event: ${{ github.event_name }}"
      - name: Observe secret masking
        run: |
          echo "The next line prints the secret on purpose"
          echo "Token: $TOKEN"