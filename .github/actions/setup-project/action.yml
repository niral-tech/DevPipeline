name: Setup Project
description: Set up Node.js and install dependencies

inputs:
  node-version:
    description: The Node.js version to set up
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
    - run: npm ci
      shell: bash